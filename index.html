<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ReyCloudDev | Secure System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap');

  :root { --glass: rgba(255, 255, 255, 0.05); --neon: #64ffda; }
  
  body { 
    margin: 0; height: 100vh; background: #0a192f;
    display: flex; justify-content: center; align-items: center;
    font-family: 'Inter', sans-serif; color: white; overflow: hidden;
  }

  /* Animated Background */
  .bg-glow { 
    position: absolute; width: 400px; height: 400px;
    background: radial-gradient(circle, #233554 0%, transparent 70%);
    filter: blur(80px); z-index: 0;
  }

  /* Glass Card */
  .card {
    background: var(--glass); backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 40px; border-radius: 30px; text-align: center;
    z-index: 1; transition: 0.5s; width: 300px;
  }

  /* Branding */
  .dev-img { width: 90px; height: 90px; border-radius: 20px; object-fit: cover; margin-bottom: 20px; border: 2px solid var(--neon); }
  .brand-name { font-weight: 600; letter-spacing: 2px; margin: 0; }
  .system-v { font-size: 10px; color: var(--neon); opacity: 0.7; margin-bottom: 30px; }

  /* Fingerprint */
  .fingerprint-btn { 
    width: 100px; height: 100px; border-radius: 50%;
    margin: 0 auto 20px; cursor: pointer; transition: 0.4s;
    display: flex; justify-content: center; align-items: center;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
  }
  .fingerprint-btn:hover { background: rgba(100, 255, 218, 0.1); border-color: var(--neon); }
  
  #statusText { font-size: 12px; opacity: 0.6; }

  /* Video Layer */
 #introVideo { 
    position: absolute; 
    width: 100%; 
    height: 100%; 
    /* 'contain' menjaga proporsi asli video tanpa dipotong */
    object-fit: contain; 
    /* Warna latar belakang di luar area video agar terlihat menyatu */
    background-color: #0a192f; 
    opacity: 0; 
    transition: 1s; 
    pointer-events: none; 
  }
  
  /* Modern Skip Button */
  #skipBtn { 
    position: absolute; bottom: 40px; padding: 12px 25px;
    background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1); color: white;
    border-radius: 50px; cursor: pointer; opacity: 0; transition: 0.5s;
    font-size: 12px; z-index: 100; pointer-events: none;
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="card" id="card">
  <img src="https://f.top4top.io/p_3812ybvy11.jpg" class="dev-img">
  <p class="brand-name">REYCLOUDDEV</p>
  <p class="system-v">SYSTEM ACCESS V2</p>
  
  <div class="fingerprint-btn" onclick="startProcess()">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="white"><path d="M12 2C8.69 2 6 4.69 6 8c0 1.05.27 2.05.74 2.94L8.2 9.53C8.07 9.19 8 8.84 8 8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .84-.07 1.19-.2 1.53l1.46 1.41C17.73 10.05 18 9.05 18 8c0-3.31-2.69-6-6-6z"/></svg>
  </div>
  <p id="statusText">TAP TO UNLOCK</p>
</div>

<button id="skipBtn" onclick="goDashboard()">SKIP INTRO</button>

<video id="introVideo" playsinline>
  <source src="https://c.top4top.io/m_3812rgnf46.mp4" type="video/mp4">
</video>

<script>
  async function startProcess() {
    const status = document.getElementById('statusText');
    const card = document.getElementById('card');
    const video = document.getElementById('introVideo');
    const skip = document.getElementById('skipBtn');

    const sequence = ["VERIFYING...", "ENCRYPTING...", "SYNCING...", "ACCESS GRANTED"];
    
    for(let text of sequence) {
      status.innerText = text;
      await new Promise(r => setTimeout(r, 800));
    }

    card.style.opacity = '0';
    setTimeout(() => {
      card.style.display = 'none';
      video.style.opacity = '1';
      video.play();
      skip.style.opacity = '1';
      skip.style.pointerEvents = 'auto';
    }, 500);
  }

  function goDashboard() { window.location.href = '/dashboard'; }
  document.getElementById('introVideo').onended = goDashboard;
</script>
</body>
</html>
