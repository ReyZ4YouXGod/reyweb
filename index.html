<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Gateway</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
    :root {
        --bg-dark: #080310;       
        --bg-gradient: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #080310 80%);
        --card-bg: rgba(26, 11, 46, 0.85);       
        --accent-pink: #db2777;   
        --accent-purple: #9333ea; 
        --accent-cyan: #06b6d4;
        --text-gray: #9ca3af; 
        --text-white: #ffffff;
        --font-title: 'Orbitron', sans-serif;
        --font-code: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body {
        background-color: var(--bg-dark);
        background-image: var(--bg-gradient);
        background-attachment: fixed;
        color: var(--text-white);
        font-family: var(--font-code);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-x: hidden;
    }

    .container-card {
        position: relative;
        width: 100%;
        max-width: 420px;
        height: 750px; /* Sedikit lebih tinggi untuk menampung widget baru */
        background: var(--card-bg);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(219, 39, 119, 0.3); 
        border-radius: 25px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        overflow: hidden;
        z-index: 10;
    }

    .view-section {
        position: absolute; 
        inset: 0;
        padding: 1.8rem;
        display: flex; 
        flex-direction: column;
        transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        opacity: 0;
        pointer-events: none;
        transform: scale(0.9) translateY(20px);
    }

    .active-view {
        opacity: 1;
        pointer-events: all;
        transform: scale(1) translateY(0);
        z-index: 5;
    }

    /* --- HOME COMPONENTS --- */
    .profile-section { text-align: center; margin-bottom: 15px; }
    .profile-img-box {
        width: 85px; height: 85px; margin: 0 auto 12px;
        border-radius: 50%; padding: 3px;
        background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
        box-shadow: 0 0 20px rgba(219, 39, 119, 0.3);
    }
    .profile-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 3px solid #000; }
    
    .video-wrapper { margin-bottom: 20px; transform: skewX(-10deg); }
    .video-box { 
        height: 80px; background: #000; border-radius: 10px; border: 2px solid rgba(219, 39, 119, 0.3); overflow: hidden;
    }
    .video-box video { width: 120%; height: 100%; object-fit: cover; transform: skewX(10deg); margin-left: -10%; }

    .action-btn {
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); 
        padding: 0.9rem; border-radius: 15px; display: flex; align-items: center; gap: 15px; 
        color: white; cursor: pointer; margin-bottom: 10px; transition: 0.3s;
    }
    .action-btn:hover { background: rgba(219, 39, 119, 0.1); border-color: var(--accent-pink); transform: translateX(5px); }
    .btn-icon-sq { width: 38px; height: 38px; background: rgba(219,39,119,0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--accent-pink); border: 1px solid rgba(219,39,119,0.2); }

    /* --- SOCIAL GRID WIDGET --- */
    .social-label {
        font-family: var(--font-title);
        font-size: 0.65rem;
        color: var(--accent-cyan);
        letter-spacing: 2px;
        margin: 15px 0 10px;
        text-align: center;
        opacity: 0.7;
    }

    .social-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 20px;
    }

    .social-item {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: 0.3s ease;
        text-decoration: none;
    }

    .social-item i { font-size: 1.2rem; }
    .social-item span { font-size: 0.6rem; color: var(--text-gray); font-family: var(--font-title); }

    .social-item:hover {
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-3px);
        border-color: var(--accent-cyan);
    }

    .social-item.wa i { color: #25D366; }
    .social-item.ig i { color: #E4405F; }
    .social-item.tg i { color: #24A1DE; }

    /* --- FORM ELEMENTS --- */
    .back-link { background: none; border: none; color: var(--text-gray); cursor: pointer; display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-family: var(--font-code); font-size: 0.8rem; }
    .form-header h2 { font-family: var(--font-title); font-size: 1.6rem; letter-spacing: 1px; }
    .form-header p { color: var(--text-gray); font-size: 0.85rem; margin: 8px 0 20px; }

    .input-box { margin-bottom: 1.1rem; position: relative; }
    .lbl { font-size: 0.65rem; color: var(--accent-pink); letter-spacing: 2px; font-weight: bold; display: block; margin-bottom: 8px; text-transform: uppercase; }
    .inp {
        width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 14px 14px 14px 45px; border-radius: 12px; color: white; font-family: var(--font-code); transition: 0.3s; font-size: 0.9rem;
    }
    .inp:focus { border-color: var(--accent-purple); box-shadow: 0 0 15px rgba(147, 51, 234, 0.3); }
    .inp-icon { position: absolute; left: 15px; top: 36px; color: var(--text-gray); font-size: 0.9rem; }

    .submit-btn {
        width: 100%; padding: 1rem; border-radius: 12px; border: none;
        background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
        color: white; font-family: var(--font-title); font-weight: 700; letter-spacing: 2px;
        cursor: pointer; margin-top: 10px; box-shadow: 0 8px 25px rgba(219, 39, 119, 0.4);
    }

    /* --- WIDGETS --- */
    .footer-widget { margin-top: auto; text-align: center; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
    .clock { font-family: var(--font-title); font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; }
    .glow-orb { position: absolute; width: 250px; height: 250px; filter: blur(100px); opacity: 0.15; pointer-events: none; border-radius: 50%; }
    </style>
</head>
<body>

    <div class="container-card" id="mainCard">
        <div class="glow-orb" style="top:-80px; left:-80px; background:var(--accent-pink);"></div>
        <div class="glow-orb" style="bottom:-80px; right:-80px; background:var(--accent-purple);"></div>

        <div id="view-home" class="view-section active-view">
            <div class="profile-section">
                <div class="profile-img-box">
                    <img src="https://k.top4top.io/p_3782cmtzx6.png" class="profile-img">
                </div>
                <h1 style="font-family: var(--font-title); font-size:1.5rem;">ReyCloudDev</h1>
                <p style="color:var(--accent-cyan); letter-spacing:4px; font-size:0.7rem; font-weight:bold;">CORE SYSTEM ACCESS</p>
            </div>

            <div class="video-wrapper">
                <div class="video-box">
                    <video autoplay loop muted playsinline>
                        <source src="https://g.top4top.io/m_3672d3e6p5.mp4" type="video/mp4">
                    </video>
                </div>
            </div>

            <div class="button-group">
                <div onclick="switchView('view-login')" class="action-btn">
                    <div class="btn-icon-sq"><i class="fas fa-fingerprint"></i></div>
                    <div style="flex:1">
                        <span style="display:block; font-weight:bold; font-family:var(--font-title); font-size:0.85rem;">LOGIN SYSTEM</span>
                        <span style="font-size:0.65rem; color:var(--text-gray)">Authorized Personnel Only</span>
                    </div>
                    <i class="fas fa-chevron-right" style="opacity:0.2; font-size:0.8rem;"></i>
                </div>

                <div onclick="switchView('view-register')" class="action-btn">
                    <div class="btn-icon-sq" style="color:var(--accent-cyan)"><i class="fas fa-user-plus"></i></div>
                    <div style="flex:1">
                        <span style="display:block; font-weight:bold; font-family:var(--font-title); font-size:0.85rem;">REGISTER</span>
                        <span style="font-size:0.65rem; color:var(--text-gray)">Create Security Identity</span>
                    </div>
                    <i class="fas fa-chevron-right" style="opacity:0.2; font-size:0.8rem;"></i>
                </div>
            </div>

            <div class="social-label">SECURE COMMUNICATIONS</div>
            <div class="social-grid">
                <a href="https://wa.me/6281260512743" target="_blank" class="social-item wa">
                    <i class="fab fa-whatsapp"></i>
                    <span>WHATSAPP</span>
                </a>
                <a href="https://instagram.com/reycloud_dev" target="_blank" class="social-item ig">
                    <i class="fab fa-instagram"></i>
                    <span>INSTAGRAM</span>
                </a>
                <a href="https://t.me/ReyCloudDev" target="_blank" class="social-item tg">
                    <i class="fab fa-telegram-plane"></i>
                    <span>TELEGRAM</span>
                </a>
            </div>

            <div class="footer-widget">
                <div class="clock" id="clock">00:00</div>
                <div style="font-size:0.65rem; color:var(--accent-pink); letter-spacing:3px; font-weight:bold;" id="date">LOADING OS...</div>
            </div>
        </div>

        <div id="view-login" class="view-section">
            <button onclick="switchView('view-home')" class="back-link">
                <i class="fas fa-arrow-left"></i> RETURN TO BASE
            </button>
            <div class="form-header">
                <h2>AUTHENTICATION</h2>
                <div style="height:3px; width:40px; background:var(--accent-pink); margin: 6px 0; border-radius:10px;"></div>
                <p>Enter credentials to unlock core.</p>
            </div>
            <form onsubmit="handleAuth(event)">
                <div class="input-box">
                    <label class="lbl">USERNAME ID</label>
                    <input type="text" class="inp" placeholder="Ex: Reyz4You" required>
                    <i class="fas fa-user-astronaut inp-icon"></i>
                </div>
                <div class="input-box">
                    <label class="lbl">SECURITY KEY</label>
                    <input type="password" class="inp" placeholder="••••••••" required>
                    <i class="fas fa-key inp-icon"></i>
                </div>
                <button type="submit" class="submit-btn">INITIALIZE <i class="fas fa-power-off"></i></button>
            </form>
        </div>

        <div id="view-register" class="view-section">
            <button onclick="switchView('view-home')" class="back-link">
                <i class="fas fa-arrow-left"></i> RETURN TO BASE
            </button>
            <div class="form-header">
                <h2>REGISTRATION</h2>
                <div style="height:3px; width:40px; background:var(--accent-cyan); margin: 6px 0; border-radius:10px;"></div>
                <p>Register your new core identity.</p>
            </div>
            <form onsubmit="handleAuth(event)">
                <div class="input-box">
                    <label class="lbl" style="color:var(--accent-cyan)">NEW USERNAME</label>
                    <input type="text" class="inp" placeholder="Username" required>
                    <i class="fas fa-user-plus inp-icon"></i>
                </div>
                <div class="input-box">
                    <label class="lbl" style="color:var(--accent-cyan)">SET SECURITY KEY</label>
                    <input type="password" class="inp" placeholder="••••••••" required>
                    <i class="fas fa-lock inp-icon"></i>
                </div>
                <button type="submit" class="submit-btn" style="background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));">
                    CREATE ACCOUNT <i class="fas fa-user-check"></i>
                </button>
            </form>
        </div>

    </div>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
        }

        function handleAuth(e) {
            e.preventDefault();
            const btn = e.target.querySelector('.submit-btn');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> VERIFYING...';
            setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}`;
            const days = ["MINGGU","SENIN","SELASA","RABU","KAMIS","JUMAT","SABTU"];
            const months = ["JAN","FEB","MAR","APR","MEI","JUN","JUL","AGU","SEP","OKT","NOV","DES"];
            document.getElementById('date').innerText = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} 2026`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
