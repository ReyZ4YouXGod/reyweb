<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Random Cecan Cecan</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:
    radial-gradient(circle at top,#1b1b1b,#070707 70%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
    color:white;
}

.bg-blur{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:#ff4da640;
    filter:blur(120px);
    top:-80px;
    right:-80px;
}

.bg-blur2{
    position:absolute;
    width:250px;
    height:250px;
    border-radius:50%;
    background:#5865f240;
    filter:blur(120px);
    bottom:-80px;
    left:-80px;
}

.card{
    width:100%;
    max-width:470px;
    background:rgba(18,18,18,.82);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.06);
    border-radius:32px;
    padding:20px;
    position:relative;
    z-index:2;
    box-shadow:
    0 20px 60px rgba(0,0,0,.45);
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.back-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:15px;
    background:#232323;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

.back-btn:hover{
    transform:scale(1.06);
    background:#2d2d2d;
}

.logo{
    text-align:center;
    flex:1;
}

.logo h1{
    font-size:22px;
    font-weight:700;
}

.logo p{
    font-size:13px;
    opacity:.6;
    margin-top:3px;
}

.badge{
    background:linear-gradient(135deg,#ff4da6,#ff78c5);
    color:white;
    padding:8px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
}

.preview{
    width:100%;
    height:560px;
    background:#111;
    border-radius:28px;
    overflow:hidden;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    border:1px solid rgba(255,255,255,.05);
}

.preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    inset:0;
    background:
    linear-gradient(
    to top,
    rgba(0,0,0,.45),
    transparent 45%);
}

.loader-box{
    position:absolute;
    z-index:3;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:15px;
}

.loader{
    width:65px;
    height:65px;
    border-radius:50%;
    border:5px solid rgba(255,255,255,.08);
    border-top:5px solid #ff4da6;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

.loader-box span{
    font-size:14px;
    opacity:.75;
}

.control{
    margin-top:18px;
}

.control label{
    display:block;
    margin-bottom:10px;
    font-size:14px;
    opacity:.75;
}

select{
    width:100%;
    padding:16px;
    border:none;
    border-radius:18px;
    background:#1d1d1d;
    color:white;
    font-size:15px;
    outline:none;
    border:1px solid rgba(255,255,255,.05);
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:18px;
}

button,
a{
    flex:1;
    border:none;
    border-radius:18px;
    padding:15px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    transition:.25s;
    text-align:center;
}

.generate{
    background:
    linear-gradient(
    135deg,
    #ff4da6,
    #ff78c5);
    color:white;
    box-shadow:
    0 10px 30px rgba(255,77,166,.25);
}

.generate:hover{
    transform:translateY(-2px);
}

.download{
    background:#222;
    color:white;
    border:1px solid rgba(255,255,255,.06);
}

.download:hover{
    background:#2a2a2a;
}

.footer{
    text-align:center;
    margin-top:18px;
    font-size:13px;
    opacity:.4;
}

.empty{
    text-align:center;
    opacity:.5;
    font-size:15px;
    padding:20px;
}

</style>
</head>
<body>

<div class="bg-blur"></div>
<div class="bg-blur2"></div>

<div class="card">

<div class="topbar">

<button class="back-btn"
onclick="location.href='/dashboard'">
<i class="fas fa-arrow-left"></i>
</button>

<div class="logo">
<h1>Random Cecan</h1>
<p></p>
</div>

<div class="badge">
PREMIUM
</div>

</div>

<div class="preview">

<div class="overlay"></div>

<div class="loader-box"
id="loaderBox">

<div class="loader"></div>

<span>
Generating Cecan...
</span>

</div>

<div class="empty"
id="emptyText">



</div>

<img id="image" hidden>

</div>

<div class="control">

<label>
Kategori Cecan
</label>

<select id="country">

<option value="china">
🇨🇳 China
</option>

<option value="indonesia">
🇮🇩 Indonesia
</option>

<option value="japan">
🇯🇵 Japan
</option>

<option value="korea">
🇰🇷 Korea
</option>

<option value="malaysia">
🇲🇾 Malaysia
</option>

<option value="thailand">
🇹🇭 Thailand
</option>

<option value="vietnam">
🇻🇳 Vietnam
</option>

<option value="hijaber">
🧕 Hijaber
</option>

<option value="cosplay">
🎭 Cosplay
</option>

</select>

</div>

<div class="buttons">

<button class="generate"
onclick="generateImage()">

<i class="fas fa-wand-magic-sparkles"></i>
Generate

</button>

<a class="download"
id="downloadBtn"
hidden
download="cecanv2.jpg">

<i class="fas fa-download"></i>
Simpan

</a>

</div>

<div class="footer">
Powered By ReyCloudDev
</div>

</div>

<script>

const image =
document.getElementById("image")

const loaderBox =
document.getElementById("loaderBox")

const emptyText =
document.getElementById("emptyText")

const downloadBtn =
document.getElementById("downloadBtn")

async function generateImage(){

    const button =
    document.querySelector(".generate")

    const country =
    document.getElementById("country").value

    image.hidden = true

    emptyText.style.display =
    "none"

    loaderBox.style.display =
    "flex"

    button.innerHTML =
    `<i class="fas fa-spinner fa-spin"></i> Generating`

    try{

        let api = ""

        if(country === "cosplay"){

            api =
            "https://api.ikyyxd.my.id/cecan/cosplay"

        } else {

            api =
            `https://api.ikyyxd.my.id/random/cecan/${country}`
        }

        const finalUrl =
        api + "?t=" + Date.now()

        image.src = finalUrl

        image.onload = () => {

            loaderBox.style.display =
            "none"

            image.hidden = false

            button.innerHTML =
            `<i class="fas fa-wand-magic-sparkles"></i> Generate`

            downloadBtn.hidden =
            false

            downloadBtn.href =
            finalUrl
        }

    }catch(err){

        console.log(err)

        loaderBox.style.display =
        "none"

        emptyText.style.display =
        "block"

        emptyText.innerText =
        "Gagal mengambil gambar 😭"

        button.innerHTML =
        `<i class="fas fa-wand-magic-sparkles"></i> Generate`
    }
}

</script>

</body>
</html>
