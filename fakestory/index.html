<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fake Story IG</title>

<style>
:root{
    --bg:#0f0f0f;
    --card:#1a1a1a;
    --input:#2a2a2a;
    --border:#333;
    --primary:#ff006a;
    --text:#ffffff;
    --muted:#b5b5b5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    padding:24px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.title{
    font-size:24px;
    font-weight:bold;
}

.dashboard-btn{
    text-decoration:none;
    color:white;
    background:#252525;
    border:1px solid var(--border);
    padding:10px 14px;
    border-radius:12px;
    font-size:14px;
    transition:0.2s;
}

.dashboard-btn:hover{
    background:#303030;
}

.description{
    font-size:14px;
    color:var(--muted);
    margin-bottom:20px;
    line-height:1.5;
}

.input-box{
    margin-bottom:16px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:bold;
}

.input-box input,
.input-box textarea{
    width:100%;
    background:var(--input);
    color:white;
    border:1px solid transparent;
    outline:none;
    border-radius:14px;
    padding:13px;
    font-size:14px;
    transition:0.2s;
}

.input-box input:focus,
.input-box textarea:focus{
    border-color:var(--primary);
}

textarea{
    resize:none;
    min-height:100px;
}

.generate-btn{
    width:100%;
    border:none;
    background:var(--primary);
    color:white;
    padding:14px;
    border-radius:14px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.generate-btn:hover{
    opacity:0.85;
}

.generate-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.result{
    display:none;
    margin-top:22px;
}

.result img{
    width:100%;
    border-radius:18px;
    border:1px solid var(--border);
}

.loading{
    display:none;
    margin-top:15px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
}
</style>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <div class="title">Fake Story IG</div>

        <a href="/dashboard" class="dashboard-btn">
            Back Dashboard
        </a>
    </div>

    <p class="description">
        Bikin fake story IG otomatis. Jangan typo username, nanti malah jadi akun NPC.
    </p>

    <div class="input-box">
        <label>Username</label>
        <input 
            type="text" 
            id="username" 
            placeholder="contoh: reycloud"
        >
    </div>

    <div class="input-box">
        <label>Caption</label>
        <textarea 
            id="caption" 
            placeholder="caption story..."
        ></textarea>
    </div>

    <div class="input-box">
        <label>URL Foto Profil</label>
        <input 
            type="text" 
            id="profile" 
            placeholder="https://example.com/foto.jpg"
        >
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generateStory()">
        Generate Story
    </button>

    <div class="loading" id="loading">
        Generating story...
    </div>

    <div class="result" id="result">
        <img id="storyImg" alt="Fake Story Result">
    </div>

</div>

<script>
async function generateStory() {
    const username = document.getElementById("username").value.trim();
    const caption = document.getElementById("caption").value.trim();
    const profile = document.getElementById("profile").value.trim();

    const result = document.getElementById("result");
    const storyImg = document.getElementById("storyImg");
    const loading = document.getElementById("loading");
    const button = document.getElementById("generateBtn");

    if (!username || !caption || !profile) {
        alert("Isi semuanya dulu. Masa form kosong berharap mukjizat.");
        return;
    }

    try {
        button.disabled = true;
        loading.style.display = "block";
        result.style.display = "none";

        const apiUrl =
            `https://api.nexray.eu.cc/maker/fakestory?username=${encodeURIComponent(username)}&caption=${encodeURIComponent(caption)}&avatar=${encodeURIComponent(profile)}`;

        storyImg.src = apiUrl;

        storyImg.onload = () => {
            loading.style.display = "none";
            result.style.display = "block";
            button.disabled = false;
        };

        storyImg.onerror = () => {
            loading.style.display = "none";
            button.disabled = false;
            alert("Gagal generate image. Cek lagi URL fotonya, jangan ngasal comot.");
        };

    } catch (err) {
        loading.style.display = "none";
        button.disabled = false;

        alert("Terjadi error.");
        console.error(err);
    }
}
</script>

</body>
</html>
