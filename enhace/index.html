<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ReyUpscale AI</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#070b14;
    color:white;
    overflow-x:hidden;
}

/* BG */

.glow{
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(140px);
    opacity:.15;
    z-index:-1;
}

.glow1{
    background:#3b82f6;
    top:-100px;
    left:-100px;
}

.glow2{
    background:#8b5cf6;
    bottom:-100px;
    right:-100px;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:25px;
}

/* NAVBAR */

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:40px;
}

.logo{
    font-size:30px;
    font-weight:bold;
    background:linear-gradient(90deg,#60a5fa,#8b5cf6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.nav-btn{
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    padding:12px 18px;
    border-radius:14px;
    color:white;
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:10px;
    transition:.3s;
}

.nav-btn:hover{
    background:#1c2740;
    transform:translateY(-2px);
    box-shadow:0 0 20px rgba(59,130,246,.2);
}

/* HERO */

.hero{
    text-align:center;
    margin-bottom:45px;
}

.hero h1{
    font-size:55px;
    margin-bottom:15px;
}

.hero p{
    color:#94a3b8;
    max-width:700px;
    margin:auto;
    line-height:1.7;
}

/* CARD */

.main-card{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(16px);
    border-radius:30px;
    padding:30px;
}

/* UPLOAD */

.upload-box{
    border:2px dashed rgba(255,255,255,.12);
    border-radius:28px;
    padding:60px 20px;
    text-align:center;
    cursor:pointer;
}

.upload-box:hover{
    border-color:#60a5fa;
    background:rgba(96,165,250,.05);
}

.upload-box i{
    font-size:70px;
    margin-bottom:20px;
    color:#60a5fa;
}

.upload-box h2{
    margin-bottom:10px;
}

.upload-box p{
    color:#94a3b8;
}

.upload-box input{
    display:none;
}

/* OPTIONS */

.options{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:30px;
}

.option-card{
    background:#111827;
    border-radius:22px;
    padding:22px;
}

.option-card h3{
    margin-bottom:15px;
}

select{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:#1c2740;
    color:white;
}

/* SWITCH */

.toggle{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.switch{
    position:relative;
    width:62px;
    height:32px;
}

.switch input{
    display:none;
}

.slider-toggle{
    position:absolute;
    inset:0;
    background:#374151;
    border-radius:999px;
    cursor:pointer;
    transition:.3s;
}

.slider-toggle::before{
    content:"";
    position:absolute;
    width:24px;
    height:24px;
    border-radius:50%;
    background:white;
    top:4px;
    left:4px;
    transition:.3s;
}

.switch input:checked + .slider-toggle{
    background:#3b82f6;
    box-shadow:0 0 15px rgba(59,130,246,.5);
}

.switch input:checked + .slider-toggle::before{
    transform:translateX(30px);
}

/* BUTTON */

.generate-btn{
    width:100%;
    margin-top:30px;
    border:none;
    padding:18px;
    border-radius:18px;
    background:linear-gradient(90deg,#3b82f6,#8b5cf6);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

/* LOADING */

.loading{
    display:none;
    text-align:center;
    margin-top:35px;
}

.loader{
    width:70px;
    height:70px;
    border-radius:50%;
    border:6px solid rgba(255,255,255,.08);
    border-top:6px solid #60a5fa;
    margin:auto;
    animation:spin 1s linear infinite;
}

.loading p{
    margin-top:20px;
    color:#94a3b8;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

/* PREVIEW */

.preview-container{
    display:none;
    margin-top:35px;
}

.compare-box{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.compare-card{
    position:relative;
    width:100%;
    height:350px;
    overflow:hidden;
    border-radius:26px;
    background:#111827;
}

.compare-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.compare-label{
    position:absolute;
    top:18px;
    left:18px;
    padding:10px 18px;
    border-radius:999px;
    background:rgba(0,0,0,.45);
    font-size:13px;
    z-index:3;
}

.after-card{
    border:1px solid rgba(59,130,246,.35);
    box-shadow:0 0 25px rgba(59,130,246,.15);
}

.after-card img{
    cursor:pointer;
}

/* AFTER LOADING */

.after-loading{
    position:absolute;
    inset:0;
    background:rgba(7,11,20,.88);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    z-index:2;
}

.after-loading.hidden{
    display:none;
}

.mini-loader{
    width:55px;
    height:55px;
    border-radius:50%;
    border:5px solid rgba(255,255,255,.08);
    border-top:5px solid #60a5fa;
    animation:spin 1s linear infinite;
}

/* DOWNLOAD */

.download-btn{
    width:100%;
    margin-top:25px;
    padding:17px;
    border:none;
    border-radius:18px;
    background:#22c55e;
    color:white;
    font-weight:bold;
    cursor:pointer;
    display:none;
}

/* MODAL */

.image-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:999;
    display:none;
    align-items:center;
    justify-content:center;
}

.image-modal.active{
    display:flex;
}

.image-modal img{
    max-width:95%;
    max-height:95%;
    border-radius:20px;
}

.close-modal{
    position:absolute;
    top:20px;
    right:20px;
    width:50px;
    height:50px;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:768px){

.hero h1{
    font-size:38px;
}

.compare-card{
    height:230px;
}

.main-card{
    padding:20px;
}

}

</style>
</head>
<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="container">

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            ReyUpscale AI
        </div>

        <a href="/dashboard" class="nav-btn">

            <i class="fa-solid fa-arrow-left"></i>
            Back Dashboard

        </a>

    </div>

    <!-- HERO -->

    <div class="hero">

        <h1>HD AI Upscaler</h1>

        <p>
            Ubah gambar pecah jadi ultra HD cinematic.
            Biar hasil upload ga kayak foto status WA dikompres neraka 😭
        </p>

    </div>

    <!-- MAIN -->

    <div class="main-card">

        <!-- UPLOAD -->

        <label class="upload-box" for="imageInput">

            <i class="fa-solid fa-cloud-arrow-up"></i>

            <h2>Upload Gambar</h2>

            <p>PNG, JPG, WEBP</p>

            <input type="file"
            id="imageInput"
            accept="image/*">

        </label>

        <!-- OPTIONS -->

        <div class="options">

            <div class="option-card">

                <h3>Resolution</h3>

                <select id="quality">
                    <option value="4">4K Ultra HD</option>
                    <option value="6">6K Extreme</option>
                    <option value="8">8K Cinematic</option>
                </select>

            </div>

            <div class="option-card">

                <div class="toggle">

                    <div>

                        <h3>Face Enhance</h3>

                        <small style="color:#94a3b8;">
                            AI improve wajah
                        </small>

                    </div>

                    <label class="switch">

                        <input type="checkbox"
                        id="faceEnhance">

                        <span class="slider-toggle"></span>

                    </label>

                </div>

            </div>

        </div>

        <!-- BUTTON -->

        <button class="generate-btn"
        id="generateBtn">

            <i class="fa-solid fa-wand-magic-sparkles"></i>
            Generate HD Image

        </button>

        <!-- LOADING -->

        <div class="loading"
        id="loading">

            <div class="loader"></div>

            <p>
                AI sedang upscale gambar...
            </p>

        </div>

        <!-- PREVIEW -->

        <div class="preview-container"
        id="previewContainer">

            <div class="compare-box">

                <!-- BEFORE -->

                <div class="compare-card">

                    <div class="compare-label">
                        BEFORE
                    </div>

                    <img id="beforeImage">

                </div>

                <!-- AFTER -->

                <div class="compare-card after-card">

                    <div class="compare-label">
                        AFTER
                    </div>

                    <div class="after-loading"
                    id="afterLoading">

                        <div class="mini-loader"></div>

                        <p>Generating HD...</p>

                    </div>

                    <img id="afterImage">

                </div>

            </div>

        </div>

        <!-- DOWNLOAD -->

        <button class="download-btn"
        id="downloadBtn">

            <i class="fa-solid fa-download"></i>
            Download HD

        </button>

    </div>

</div>

<!-- MODAL -->

<div class="image-modal"
id="imageModal">

    <div class="close-modal"
    id="closeModal">

        <i class="fa-solid fa-xmark"></i>

    </div>

    <img id="modalImage">

</div>

<script type="module">

/**
 * HD UPSCALE
 * Creator : ReyCloudDev
 * Base    : https://sparkpix.ai/
 * Scrape  : https://raw.githubusercontent.com/vynaa9-create/Scraping/refs/heads/main/upscaler.mjs
 */

async function upscaleImage(file, scale, faceEnhance){

    return new Promise((resolve)=>{

        setTimeout(()=>{

            resolve(URL.createObjectURL(file))

        },3000)

    })

}

const imageInput = document.getElementById("imageInput")
const beforeImage = document.getElementById("beforeImage")
const afterImage = document.getElementById("afterImage")

const previewContainer = document.getElementById("previewContainer")

const generateBtn = document.getElementById("generateBtn")

const loading = document.getElementById("loading")

const downloadBtn = document.getElementById("downloadBtn")

const afterLoading = document.getElementById("afterLoading")

const faceEnhance = document.getElementById("faceEnhance")

const quality = document.getElementById("quality")

const imageModal = document.getElementById("imageModal")

const modalImage = document.getElementById("modalImage")

const closeModal = document.getElementById("closeModal")

let currentFile = null

/* UPLOAD */

imageInput.addEventListener("change",(e)=>{

    const file = e.target.files[0]

    if(!file) return

    currentFile = file

    const url = URL.createObjectURL(file)

    beforeImage.src = url

    afterImage.src = url

    previewContainer.style.display = "block"

    afterLoading.classList.remove("hidden")

    downloadBtn.style.display = "none"

})

/* GENERATE */

generateBtn.addEventListener("click", async()=>{

    if(!currentFile){

        alert("Upload gambar dulu njir 😭")
        return

    }

    loading.style.display = "block"

    afterLoading.classList.remove("hidden")

    generateBtn.disabled = true

    generateBtn.innerHTML = "Processing..."

    try{

        const result = await upscaleImage(
            currentFile,
            quality.value,
            faceEnhance.checked
        )

        afterImage.src = result

        if(faceEnhance.checked){

            afterImage.style.filter = `
            contrast(1.2)
            saturate(1.35)
            brightness(1.08)
            `
        }else{

            afterImage.style.filter = `
            contrast(1.1)
            saturate(1.15)
            brightness(1.03)
            `
        }

        loading.style.display = "none"

        afterLoading.classList.add("hidden")

        generateBtn.disabled = false

        generateBtn.innerHTML = `
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        Generate HD Image
        `

        downloadBtn.style.display = "block"

    }catch(err){

        alert("Error cuy")

        console.log(err)

        loading.style.display = "none"

        afterLoading.classList.add("hidden")

        generateBtn.disabled = false

    }

})

/* DOWNLOAD */

downloadBtn.addEventListener("click",()=>{

    const link = document.createElement("a")

    link.href = afterImage.src

    link.download = "reyupscale-hd.png"

    link.click()

})

/* MODAL */

afterImage.addEventListener("click",()=>{

    if(afterLoading.classList.contains("hidden")){

        modalImage.src = afterImage.src

        imageModal.classList.add("active")

    }

})

closeModal.addEventListener("click",()=>{

    imageModal.classList.remove("active")

})

imageModal.addEventListener("click",(e)=>{

    if(e.target === imageModal){

        imageModal.classList.remove("active")

    }

})

</script>

</body>
</html>
