<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reyz OS | Modern Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        
        :root {
            --bg: #050505;
            --accent: #ffffff;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: var(--accent);
            letter-spacing: -0.02em;
        }

        /* Smooth Background Glow */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, #1e1e1e 0%, transparent 50%);
            z-index: -1;
        }

        .bento-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .bento-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Modern Vinyl */
        .vinyl-wrapper {
            position: relative; width: 140px; height: 140px;
        }
        .vinyl-disc {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(#111, #222, #111, #222, #111);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.05);
            display: flex; items-center: center; justify-content: center;
        }
        .vinyl-disc::after {
            content: ""; width: 40px; height: 40px; background: var(--bg);
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.1);
        }

        .spinning { animation: spin 4s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .input-minimal {
            background: transparent; border: none; outline: none; width: 100%;
            font-size: 1.1rem; color: white;
        }

        .btn-modern {
            background: white; color: black; padding: 12px 24px;
            border-radius: 14px; font-weight: 600; transition: all 0.3s;
        }
        .btn-modern:hover { opacity: 0.8; transform: translateY(-2px); }

        .nav-link {
            padding: 10px 20px; border-radius: 12px; font-weight: 500;
            color: #888; transition: 0.3s;
        }
        .nav-link.active { color: white; background: rgba(255,255,255,0.05); }

        /* Custom Back Button */
        .back-btn {
            position: fixed; top: 30px; left: 30px; z-index: 100;
            font-weight: 600; color: #666; display: flex; align-items: center; gap: 8px;
        }
        .back-btn:hover { color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="bg-glow"></div>

    <!-- Back Navigation -->
    <a href="/dashboard" class="back-btn transition-all">
        <i class="fa-solid fa-chevron-left"></i> <span>Dashboard</span>
    </a>

    <main class="w-full max-w-4xl space-y-6">
        
        <!-- Minimal Header -->
        <div class="mb-12">
            <h1 class="text-4xl font-bold tracking-tight mb-2">Engine <span class="text-neutral-500 font-light">Suite</span></h1>
            <p class="text-neutral-500">Multipurpose digital tools for creator.</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex gap-2 mb-8 bg-[#111] p-1.5 rounded-2xl w-fit">
            <button onclick="switchTab('spotify')" id="nav-spotify" class="nav-link active">Spotify</button>
            <button onclick="switchTab('zip')" id="nav-zip" class="nav-link">Web Cloner</button>
        </div>

        <!-- Panel Spotify -->
        <div id="panel-spotify" class="space-y-6">
            <div class="bento-card p-6 flex items-center gap-4">
                <i class="fa-solid fa-search text-neutral-600"></i>
                <input type="text" id="spotifyInput" placeholder="Cari musik..." class="input-minimal">
                <button onclick="searchSpotify()" class="btn-modern">Search</button>
            </div>

            <div id="spotifyResults"></div>
        </div>

        <!-- Panel ZIP -->
        <div id="panel-zip" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bento-card p-8 flex flex-col justify-between">
                    <div>
                        <h2 class="text-xl font-bold mb-4">Web Cloner</h2>
                        <p class="text-neutral-500 text-sm mb-6">Extract assets from any URL and package them into a deployable ZIP.</p>
                        <input type="text" id="zipInput" placeholder="https://..." class="bg-[#111] w-full p-4 rounded-xl border border-white/5 outline-none mb-4">
                    </div>
                    <button onclick="handleZip()" class="btn-modern w-full">Start Extraction</button>
                </div>
                
                <div id="zipResult" class="bento-card p-8 flex flex-col items-center justify-center border-dashed opacity-50">
                    <i class="fa-solid fa-box-open text-4xl mb-4 text-neutral-700"></i>
                    <p class="text-sm text-neutral-500">Output will appear here</p>
                    <a id="zipDlLink" href="#" class="hidden mt-4 text-white underline font-bold">Download ZIP</a>
                </div>
            </div>
        </div>

    </main>

    <audio id="audioCore"></audio>

    <script>
        const audio = document.getElementById('audioCore');

        function switchTab(tab) {
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById('nav-' + tab).classList.add('active');
            document.getElementById('panel-spotify').classList.toggle('hidden', tab !== 'spotify');
            document.getElementById('panel-zip').classList.toggle('hidden', tab !== 'zip');
        }

        async function searchSpotify() {
            const query = document.getElementById('spotifyInput').value;
            const container = document.getElementById('spotifyResults');
            if(!query) return;

            container.innerHTML = `<div class="p-10 text-center text-neutral-500 tracking-widest text-xs uppercase">Connecting to Database...</div>`;

            try {
                const res = await fetch(`https://api.ikyyxd.my.id/search/spotifyplay?query=${encodeURIComponent(query)}`);
                const data = await res.json();

                if(data.status && data.result) {
                    const s = data.result;
                    container.innerHTML = `
                        <div class="bento-card p-10 flex flex-col md:flex-row items-center gap-12 animate-in fade-in duration-700">
                            <div class="vinyl-wrapper">
                                <div id="vinylDisk" class="vinyl-disc"></div>
                            </div>

                            <div class="flex-1 text-center md:text-left">
                                <span class="text-[10px] font-bold text-neutral-600 uppercase tracking-widest">Now Playing</span>
                                <h3 class="text-3xl font-bold mt-1 mb-2">${s.title}</h3>
                                <p class="text-neutral-500 mb-8">${s.artist}</p>
                                
                                <div class="flex justify-center md:justify-start gap-4">
                                    <button onclick="playMusic('${s.download}')" class="text-2xl hover:text-blue-500 transition"><i class="fa-solid fa-play"></i></button>
                                    <button onclick="pauseMusic()" class="text-2xl hover:text-yellow-500 transition"><i class="fa-solid fa-pause"></i></button>
                                    <button onclick="stopMusic()" class="text-2xl hover:text-red-500 transition"><i class="fa-solid fa-stop-1"></i></button>
                                    <a href="${s.download}" class="text-2xl hover:text-green-500 transition"><i class="fa-solid fa-download"></i></a>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } catch(e) { container.innerHTML = '<p class="text-red-500">API Error.</p>'; }
        }

        function playMusic(url) {
            const disk = document.getElementById('vinylDisk');
            if(audio.src !== url) audio.src = url;
            audio.play();
            disk.classList.add('spinning');
        }

        function pauseMusic() {
            document.getElementById('vinylDisk').classList.remove('spinning');
            audio.pause();
        }

        function stopMusic() {
            const disk = document.getElementById('vinylDisk');
            audio.pause(); audio.currentTime = 0;
            disk.classList.remove('spinning');
        }

        async function handleZip() {
            const url = document.getElementById('zipInput').value;
            const resBox = document.getElementById('zipResult');
            const dl = document.getElementById('zipDlLink');
            if(!url) return;
            
            resBox.innerHTML = '<div class="animate-spin rounded-full h-8 w-8 border-t-2 border-white"></div>';
            try {
                const res = await fetch(`https://api.ikyyxd.my.id/tools/saveweb2zip?url=${encodeURIComponent(url)}`);
                const data = await res.json();
                if(data.status) {
                    resBox.innerHTML = '<i class="fa-solid fa-check-circle text-4xl text-green-500 mb-2"></i><p>Ready to download</p>';
                    dl.href = data.result;
                    dl.classList.remove('hidden');
                    resBox.appendChild(dl);
                }
            } catch(e) { resBox.innerHTML = 'Error.'; }
        }
    </script>
</body>
</html>
