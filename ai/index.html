
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AkiraAi Modern</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#070b14;
color:white;
height:100dvh;
overflow:hidden;
position:relative;
}

/* BACKGROUND */

.bg{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
}

.circle{
position:absolute;
border-radius:50%;
filter:blur(90px);
opacity:.4;
animation:float 8s infinite alternate;
}

.c1{
width:300px;
height:300px;
background:#00bfff;
top:-100px;
left:-100px;
}

.c2{
width:250px;
height:250px;
background:#7b2fff;
bottom:-100px;
right:-100px;
animation-delay:2s;
}

@keyframes float{
from{
transform:translateY(0px) translateX(0px);
}
to{
transform:translateY(40px) translateX(20px);
}
}

/* APP */

.app{
height:100dvh;
display:flex;
flex-direction:column;
backdrop-filter:blur(10px);
}

/* HEADER */

.header{
display:flex;
align-items:center;
gap:12px;
padding:15px 20px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,.08);
}

/* BACK BUTTON */

.back-btn{
width:42px;
height:42px;
border:none;
border-radius:12px;
background:rgba(255,255,255,.08);
color:white;
font-size:22px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
backdrop-filter:blur(10px);
transition:.2s;
}

.back-btn:hover{
transform:scale(1.08);
background:rgba(255,255,255,.15);
}

/* PROFILE */

.profile{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
border:2px solid #00bfff;
box-shadow:0 0 15px #00bfff;
}

.header-text h1{
font-size:18px;
font-weight:600;
}

.header-text p{
font-size:12px;
color:#aaa;
}

/* CHAT */

.chat{
flex:1;
overflow-y:auto;
padding:20px;
padding-bottom:120px;
display:flex;
flex-direction:column;
gap:15px;
scroll-behavior:smooth;
-webkit-overflow-scrolling:touch;
overscroll-behavior:contain;
}

.chat::-webkit-scrollbar{
width:5px;
}

.chat::-webkit-scrollbar-thumb{
background:#00bfff;
border-radius:10px;
}

.msg{
max-width:80%;
padding:15px;
border-radius:18px;
line-height:1.6;
font-size:14px;
animation:fade .25s ease;
white-space:pre-wrap;
word-wrap:break-word;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.user{
align-self:flex-end;
background:linear-gradient(135deg,#00bfff,#0077ff);
border-bottom-right-radius:5px;
box-shadow:0 0 15px rgba(0,191,255,.3);
}

.bot{
align-self:flex-start;
background:rgba(255,255,255,.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.05);
border-bottom-left-radius:5px;
}

/* INPUT */

.input-area{
position:sticky;
bottom:0;
left:0;
width:100%;
display:flex;
gap:10px;
padding:15px;
padding-bottom:calc(env(safe-area-inset-bottom) + 10px);
background:rgba(255,255,255,.04);
backdrop-filter:blur(20px);
border-top:1px solid rgba(255,255,255,.05);
z-index:999;
}

.input-box{
flex:1;
display:flex;
align-items:center;
background:rgba(255,255,255,.06);
border-radius:15px;
padding:0 15px;
}

input{
flex:1;
padding:15px 10px;
background:none;
border:none;
outline:none;
color:white;
font-size:16px;
}

input::placeholder{
color:#888;
}

button.send{
border:none;
background:linear-gradient(135deg,#00bfff,#0077ff);
color:white;
padding:14px 20px;
border-radius:15px;
font-weight:600;
cursor:pointer;
transition:.2s;
box-shadow:0 0 15px rgba(0,191,255,.4);
}

button.send:hover{
transform:scale(1.05);
}

/* TYPING */

.typing{
display:flex;
gap:5px;
align-items:center;
}

.typing span{
width:8px;
height:8px;
background:white;
border-radius:50%;
animation:blink 1s infinite;
}

.typing span:nth-child(2){
animation-delay:.2s;
}

.typing span:nth-child(3){
animation-delay:.4s;
}

@keyframes blink{
0%{
opacity:.2;
transform:translateY(0);
}
50%{
opacity:1;
transform:translateY(-3px);
}
100%{
opacity:.2;
transform:translateY(0);
}
}

</style>
</head>
<body>

<div class="bg">
<div class="circle c1"></div>
<div class="circle c2"></div>
</div>

<div class="app">

<!-- HEADER -->

<div class="header">

<button class="back-btn" onclick="goBack()">
←
</button>

<img 
src="https://b.top4top.io/p_3651j7eif2.jpg"
class="profile"
>

<div class="header-text">
<h1>AkiraAi</h1>
<p>AI Assistant By ReyCloudDev</p>
</div>

</div>

<!-- CHAT -->

<div class="chat" id="chat"></div>

<!-- INPUT -->

<div class="input-area">

<div class="input-box">
<input 
type="text" 
id="text"
placeholder="Tanya sesuatu..."
autocomplete="off"
>
</div>

<button class="send" onclick="sendMessage()">
Kirim
</button>

</div>

</div>

<script>

const chat = document.getElementById("chat");

const SYSTEM_PROMPT = `
Nama mu adalah Akira, kamu adalah asisten kecerdasan buatan yang sering membantu orang lain jika ada yang ditanyakan, dan kamu di buat oleh ReyCloudDev.

Tambahkan tulisan AkiraAi di paling atas tanpa gerak sama sekali.

Untuk jawaban dibawah gunakan format seperti ini:
*jawaban*

Jangan hilangkan tanda bintang yang ada.

Untuk jarak atas bawah berikan 2 langkah.
`;

function goBack(){

window.location.href = "dashboard.html";

/*
Kalau mau balik ke halaman sebelumnya:
window.history.back();
*/

}

function scrollBottom(){

setTimeout(()=>{

chat.scrollTo({
top:chat.scrollHeight,
behavior:"smooth"
});

},100);

}

function addMessage(text,type){

const div = document.createElement("div");

div.className = `msg ${type}`;

div.innerText = text;

chat.appendChild(div);

scrollBottom();

}

function addTyping(){

const div = document.createElement("div");

div.className = "msg bot typing-box";

div.innerHTML = `
<div class="typing">
<span></span>
<span></span>
<span></span>
</div>
`;

chat.appendChild(div);

scrollBottom();

}

async function sendMessage(){

const input = document.getElementById("text");

const text = input.value.trim();

if(!text) return;

addMessage(text,"user");

input.value = "";

addTyping();

try{

const response = await fetch(
`https://api.nexray.eu.cc/ai/gemini?text=${encodeURIComponent(SYSTEM_PROMPT + "\nUser: " + text)}`
);

const data = await response.json();

console.log(data);

document.querySelector(".typing-box").remove();

let reply =
data.result ||
data.answer ||
data.message ||
JSON.stringify(data);

reply = reply.replace(/`/g,"");

addMessage(reply,"bot");

}catch(err){

document.querySelector(".typing-box").remove();

addMessage("Error jir","bot");

console.error(err);

}

}

document
.getElementById("text")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){
sendMessage();
}

});

/* AUTO SCROLL PAS KEYBOARD */

const input = document.getElementById("text");

input.addEventListener("focus",()=>{

setTimeout(()=>{

scrollBottom();

},300);

});

/* FIX VIEWPORT MOBILE */

window.visualViewport.addEventListener("resize",()=>{

document.body.style.height =
window.visualViewport.height + "px";

scrollBottom();

});

</script>

</body>
</html>
