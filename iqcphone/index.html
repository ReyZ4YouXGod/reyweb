<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IQC Generator | By ReyClouDev</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root {
            --bg-main: #121212;
            --bg-deep: #0a0a0a;
            --card-light: #e5e5e5;
            --card-surface: #1e1e1e;
            --text-on-light: #1f2937;
            --text-on-dark: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --radius-box: 24px;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none; user-select: none; scroll-behavior: smooth;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-on-dark);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            overflow: hidden;
        }

        .app-frame {
            width: 100%; max-width: 480px; height: 100vh;
            background: var(--bg-main);
            position: relative; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        @media(min-width: 500px) {
            body { align-items: center; }
            .app-frame { height: 95vh; border-radius: 35px; border: 4px solid #333; }
        }

        .header-area {
            padding: 30px 24px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .btn-icon {
            width: 42px; height: 42px; border-radius: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-on-dark); display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; transition: 0.2s; position: relative;
        }
        .btn-icon:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

        .content-area {
            flex: 1; overflow-y: auto; padding: 0 24px 100px;
            scrollbar-width: none;
        }
        .content-area::-webkit-scrollbar { display: none; }

        .profile-section {
            display: flex; align-items: center; gap: 15px; margin-bottom: 15px;
        }
        .p-img {
            width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--text-on-dark);
            object-fit: cover;
        }
        .p-info h2 { font-size: 18px; font-weight: 700; color: var(--text-on-dark); margin-bottom: 2px; height: 22px; }
        .p-info p { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

        .social-bar { margin-top: 8px; display: flex; gap: 10px; }
        .soc-icon {
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.1); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; text-decoration: none; transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .ad-slider {
            position: relative; width: 100%; height: 140px;
            border-radius: 20px; overflow: hidden; margin: 20px 0;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
        }
        .ad-slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.6s ease-in-out; }
        .ad-slide.active { opacity: 1; }
        .ad-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .ad-dots {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; z-index: 10;
        }
        .ad-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.6); cursor: pointer; }
        .ad-dot.active { background: white; }

        .marquee-container {
            background: #1e1e1e; border-radius: 8px; overflow: hidden; white-space: nowrap;
            padding: 8px 0; margin-bottom: 25px; border-left: 3px solid var(--accent); margin-top: 10px;
        }
        .marquee-text {
            display: inline-block; padding-left: 100%; animation: marquee 15s linear infinite;
            font-size: 11px; color: var(--text-muted); font-family: monospace;
        }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .form-card, .result-card {
            background: var(--card-surface);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 600; margin-bottom: 8px;
            color: var(--text-muted);
        }
        .input-group input {
            width: 100%; padding: 12px 16px;
            background: #2a2a2a; border: 1px solid #444;
            border-radius: 16px; color: white; font-size: 14px;
        }

        .provider-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        .provider-btn {
            padding: 8px 16px; background: #2a2a2a; border: 1px solid #444; border-radius: 30px;
            color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .provider-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .generate-btn {
            width: 100%; padding: 14px; background: linear-gradient(90deg, #3b82f6, #2563eb);
            border: none; border-radius: 16px; color: white; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
        }

        .iqc-preview {
            background: #0a0a0a; border-radius: 20px; min-height: 200px;
            display: flex; align-items: center; justify-content: center; margin-bottom: 16px; overflow: hidden;
        }
        .iqc-preview img { width: 100%; max-height: 400px; object-fit: contain; }

        .result-actions { display: flex; gap: 12px; }
        .download-btn { flex: 1; padding: 12px; background: #10b981; border: none; border-radius: 16px; color: white; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .menu-overlay, .sheet-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .menu-overlay.active, .sheet-overlay.active { opacity: 1; pointer-events: auto; }
        
        .menu-panel {
            position: absolute; top: 0; left: 0; width: 80%; height: 100%;
            background: var(--bg-deep); transform: translateX(-100%); transition: 0.3s; padding: 20px;
        }
        .menu-overlay.active .menu-panel { transform: translateX(0); }

        .ripple { position: relative; overflow: hidden; }
        .ripple span {
            position: absolute; border-radius: 50%; background: rgba(255,255,255,0.3);
            transform: scale(0); animation: ripple 0.6s linear; pointer-events: none;
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        .spin { animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <div class="app-frame">
        <div class="header-area">
            <!-- FITUR BACK DASHBOARD -->
            <div class="btn-icon ripple" onclick="window.location.href='/dashboard'">
                <i class="ri-arrow-left-line"></i>
            </div>
            
            <div style="font-weight:800; font-size:16px; letter-spacing:1px;">IQC<span style="color:var(--text-muted);">TOOLS</span></div>
            
            <div class="btn-icon ripple" id="btnMenu">
                <i class="ri-menu-3-line"></i>
            </div>
        </div>

        <div class="content-area" id="mainContent">
            <div class="profile-section">
                <img src="https://k.top4top.io/p_3782cmtzx6.png" class="p-img">
                <div class="p-info">
                    <h2 id="userName"></h2>
                    <p><span class="status-dot"></span> Online</p>
                </div>
            </div>

            <div class="ad-slider" id="adSlider"></div>

            <div class="marquee-container">
                <div class="marquee-text">IQC Generator • Buat IQC keren dengan mudah • Pilih provider & custom teks • Download hasilnya!</div>
            </div>

            <div class="form-card">
                <div class="input-group">
                    <label><i class="ri-text-line"></i> Teks Pesan</label>
                    <input type="text" id="textInput" value="Hai">
                </div>

                <div class="input-group">
                    <label><i class="ri-wifi-line"></i> Provider</label>
                    <div class="provider-buttons" id="providerButtons">
                        <button class="provider-btn active" data-provider="Axis">Axis</button>
                        <button class="provider-btn" data-provider="Telkomsel">Telkomsel</button>
                        <button class="provider-btn" data-provider="Indosat">Indosat</button>
                        <button class="provider-btn" data-provider="XL">XL</button>
                        <button class="provider-btn" data-provider="Three">Three</button>
                    </div>
                </div>

                <div style="display:flex; gap:12px; margin-bottom:16px;">
                    <div class="input-group" style="flex:1;">
                        <label>Jam</label>
                        <input type="number" id="jamInput" value="11">
                    </div>
                    <div class="input-group" style="flex:1;">
                        <label>Baterai (%)</label>
                        <input type="number" id="bateraiInput" value="90">
                    </div>
                </div>

                <button class="generate-btn ripple" id="generateBtn">
                    <i class="ri-flashlight-fill"></i> Generate IQC
                </button>
            </div>

            <div class="result-card" id="resultCard" style="display: none;">
                <div class="iqc-preview" id="iqcPreview"></div>
                <div class="result-actions">
                    <button class="download-btn ripple" id="downloadBtn"><i class="ri-download-2-line"></i> Download</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
                <h3 style="color:white;">Menu</h3>
                <div id="menuClose" style="cursor:pointer; font-size:24px;"><i class="ri-close-line"></i></div>
            </div>
            <div style="cursor:pointer; padding:15px 0; border-bottom:1px solid #333;" onclick="window.location.href='/ai'">
                <h4>Chat Ai</h4>
                <p style="font-size:12px; color:gray;">Mau Chat AkiraAi?</p>
            </div>
        </div>
    </div>

    <script>
        let currentImageUrl = '';
        let currentProvider = 'Axis';
        const adBanners = ["https://files.catbox.moe/lgc3gb.jpeg", "https://files.catbox.moe/tlcfw5.jpg", "https://files.catbox.moe/inrytu.jpg"];

        // Typewriter
        const txtName = "IQC TOOLS";
        let idx = 0;
        function typeWriter() {
            if (idx < txtName.length) {
                document.getElementById('userName').innerHTML += txtName.charAt(idx);
                idx++;
                setTimeout(typeWriter, 100);
            }
        }

        // Slider
        function initSlider() {
            const slider = document.getElementById('adSlider');
            adBanners.forEach((url, i) => {
                const div = document.createElement('div');
                div.className = `ad-slide ${i===0?'active':''}`;
                div.innerHTML = `<img src="${url}">`;
                slider.appendChild(div);
            });
            let cur = 0;
            setInterval(() => {
                const slides = document.querySelectorAll('.ad-slide');
                slides[cur].classList.remove('active');
                cur = (cur + 1) % slides.length;
                slides[cur].classList.add('active');
            }, 4000);
        }

        // Logic
        document.querySelectorAll('.provider-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.provider-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentProvider = btn.dataset.provider;
            }
        });

        document.getElementById('generateBtn').onclick = async () => {
            const text = document.getElementById('textInput').value;
            const jam = document.getElementById('jamInput').value;
            const bat = document.getElementById('bateraiInput').value;
            const preview = document.getElementById('iqcPreview');
            
            document.getElementById('resultCard').style.display = 'block';
            preview.innerHTML = '<i class="ri-loader-4-line spin" style="font-size:30px;"></i>';

            try {
                const res = await fetch(`https://api.nexray.eu.cc/maker/v1/iqc?text=${encodeURIComponent(text)}&provider=${currentProvider}&jam=${jam}&baterai=${bat}`);
                const blob = await res.blob();
                currentImageUrl = URL.createObjectURL(blob);
                preview.innerHTML = `<img src="${currentImageUrl}">`;
            } catch (e) {
                preview.innerHTML = 'Gagal generate.';
            }
        };

        document.getElementById('downloadBtn').onclick = () => {
            const a = document.createElement('a');
            a.href = currentImageUrl;
            a.download = 'iqc-result.png';
            a.click();
        };

        // Ripple
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.ripple');
            if (btn) {
                const rect = btn.getBoundingClientRect();
                const span = document.createElement('span');
                const size = Math.max(btn.clientWidth, btn.clientHeight);
                span.style.width = span.style.height = `${size}px`;
                span.style.left = `${e.clientX - rect.left - size/2}px`;
                span.style.top = `${e.clientY - rect.top - size/2}px`;
                btn.appendChild(span);
                setTimeout(() => span.remove(), 600);
            }
        });

        document.getElementById('btnMenu').onclick = () => document.getElementById('menuOverlay').classList.add('active');
        document.getElementById('menuClose').onclick = () => document.getElementById('menuOverlay').classList.remove('active');

        window.onload = () => { typeWriter(); initSlider(); };
    </script>
</body>
</html>
