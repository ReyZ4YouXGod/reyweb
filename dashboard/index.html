<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NgapainBang?</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f172a;
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --whatsapp: #25d366;
            --telegram: #0088cc;
            --instagram: #e1306c;
            --pinterest: #e60023;
            --danger: #ff4b2b;
            --ai-color: #00f2ff;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            width: 100%;
            max-width: 500px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h3 { letter-spacing: 1px; font-weight: 800; margin: 0; }

        .profile-trigger {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            cursor: pointer;
            overflow: hidden;
            transition: 0.3s;
        }
        .profile-trigger:hover { transform: scale(1.1); box-shadow: 0 0 10px var(--primary); }
        .profile-trigger img { width: 100%; height: 100%; object-fit: cover; }

        /* NEON BANNER */
        .neon-border-box {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 190px;
            padding: 4px;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.2);
        }

        .neon-border-box::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(transparent, var(--primary), var(--secondary), var(--primary), transparent);
            animation: rotateNeon 4s linear infinite;
        }

        @keyframes rotateNeon {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .banner-inner {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 22px;
            overflow: hidden;
            z-index: 1;
        }

        .banner-video { width: 100%; height: 100%; object-fit: cover; }

        .banner-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.9), transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px 20px;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .profile-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 350px;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            cursor: pointer;
            color: var(--secondary);
        }

        .profile-img-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            margin: 0 auto 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }
        .profile-img-large img { width: 100%; height: 100%; object-fit: cover; }

        .profile-card h2 { margin: 10px 0 5px; font-size: 22px; color: var(--text-main); }
        .profile-card p { font-size: 14px; color: var(--secondary); font-weight: bold; margin-bottom: 20px; }

        .badge-dev {
            background: var(--primary);
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 15px;
        }

        /* GRID MENU */
        .grid-container {
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tool-card {
            background: var(--card-bg);
            padding: 22px 15px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .tool-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .tool-card i { font-size: 28px; color: var(--primary); }
        .tool-card span { font-size: 12px; font-weight: 800; text-transform: uppercase; }

        .section-label {
            width: 100%;
            max-width: 500px;
            font-size: 11px;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* CUSTOM COLORS */
        .ai-card i { color: var(--ai-color); filter: drop-shadow(0 0 5px var(--ai-color)); }
        .ai-card:hover { border-color: var(--ai-color); }
        
        .pin-card i { color: var(--pinterest); }
        .pin-card:hover { border-color: var(--pinterest); }
        
        .fake-card i { color: #ffffff; filter: drop-shadow(0 0 5px #ff0000); }
        .fake-card:hover { border-color: var(--danger); }

        .wa-card i { color: var(--whatsapp); }
        .tele-card i { color: var(--telegram); }
        .ig-card i { color: var(--instagram); }
        .grub-card i { color: var(--whatsapp); filter: drop-shadow(0 0 5px var(--whatsapp)); }
    </style>
</head>
<body>

    <div class="header">

    <script>

</body>
</html>
