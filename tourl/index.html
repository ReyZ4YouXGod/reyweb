<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro TO URL Uploader</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0b0b;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:360px;
    padding:20px;
    background:#161616;
    border-radius:14px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.drop{
    border:2px dashed #444;
    padding:25px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:15px;
}

.drop.dragover{
    border-color:#00ff99;
    background:#111;
}

button{
    width:100%;
    padding:10px;
    background:#00ff99;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00cc77;
}

.bar{
    width:100%;
    height:8px;
    background:#222;
    border-radius:10px;
    margin-top:15px;
    overflow:hidden;
}

.bar-fill{
    height:100%;
    width:0%;
    background:#00ff99;
    transition:0.2s;
}

a{
    color:#00ff99;
}
</style>
</head>
<body>

<div class="box">

    <div id="drop" class="drop">
        Drop file / click here
        <input type="file" id="file" hidden>
    </div>

    <button onclick="uploadFile()">UPLOAD</button>

    <div class="bar">
        <div class="bar-fill" id="bar"></div>
    </div>

    <p id="result"></p>

</div>

<script src="upload.js"></script>

</body>
</html>
