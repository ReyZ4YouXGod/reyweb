<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Upload To URL</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:#0d0d0d;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:360px;
    background:#181818;
    padding:20px;
    border-radius:14px;
    text-align:center;
}

input{
    width:100%;
    margin-top:10px;
}

button{
    width:100%;
    margin-top:10px;
    padding:10px;
    background:#00ff99;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#00cc77;
}

#result{
    margin-top:15px;
    word-break:break-all;
}

a{
    color:#00ff99;
}
</style>
</head>
<body>

<div class="box">
    <h2>TO URL UPLOADER</h2>

    <input type="file" id="file">
    <button onclick="uploadFile()">UPLOAD</button>

    <div id="result"></div>
</div>

<script src="upload.js"></script>
</body>
</html>
